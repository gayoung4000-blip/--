<html lang="ko">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- IOS/Chrome PWA 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PUMTO" />
  <link rel="apple-touch-icon" href="/PUMTO.img/logo.1.png" />
  <!-- Android/Chrome PWA 설정 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FF9F46" />

    <!-- 移댁뭅?ㅽ넚/SNS 怨듭쑀 ?몃꽕???ㅼ젙 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="?덊넗 - PUMTO">
    <meta property="og:description" content="?곕━ ?꾩씠 誘몄닠??泥섏쓬遺???앷퉴吏, PUMTO">
    <meta property="og:image" content="https://pumto-web-app.vercel.app/PUMTO.img/some.11.png">
    <meta property="og:url" content="https://pumto-web-app.vercel.app">
    <script src="pwa-loader.js?v=static-dot-5" defer></script>
</head>
<body>
  <div class="mobile-container">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <button class="save-back-btn" type="button" aria-label="뒤로가기" onclick="goBackFromSave()">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <h1 class="title">저장</h1>
      </div>
      <button class="edit-btn">편집</button>
    </header>

    <script>
      function goBackFromSave() {
        if (document.referrer && new URL(document.referrer).origin === location.origin) {
          history.back();
        } else {
          location.href = 'home.html?v=smooth-popular-scroll-2';
        }
      }
    </script>

    <main class="main-content">
      <!-- 저장 상태 바 -->
      <section class="save-status">
        <div class="save-count">
          <span class="dot"></span>
          <span>3개 저장됨</span>
        </div>
        <div class="sort-options">
          <button class="sort-btn active">최근순</button>
          <button class="sort-btn">거리순</button>
        </div>
      </section>

      <!-- 저장된 학원 리스트 -->
      <section class="academy-list">
        <!-- 학원 1 -->
        <div class="academy-card" onclick="location.href='art-academy.html'">
          <div class="img-wrapper">
            <img src="./PUMTO.img/img.25.png" alt="그림공룡 미술학원">
          </div>
          <button class="wish-btn active" onclick="event.stopPropagation();"><i class="fa-solid fa-heart"></i></button>
          <div class="card-info">
            <h3 class="academy-name">그림공룡 미술학원</h3>
            <p class="academy-location">
              <i class="fa-solid fa-location-dot pin-icon"></i>
              서울 서초구 서초동 123-45 · 도보 5분
            </p>
            <div class="tag-row">
              <span class="tag orange">유치부 A반</span>
              <span class="divider-line"></span>
              <span class="tag gray">창의 미술</span>
            </div>
          </div>
        </div>

        <!-- 학원 2 -->
        <div class="academy-card" onclick="location.href='art-academy.html'">
          <div class="img-wrapper">
            <img src="./PUMTO.img/img.54.png" alt="그림아이 미술학원">
            <img src="./PUMTO.img/img.52.png" alt="인증 배지" class="verify-badge-img">
          </div>
          <button class="wish-btn active" onclick="event.stopPropagation();"><i class="fa-solid fa-heart"></i></button>
          <div class="card-info">
            <h3 class="academy-name">그림아이 미술학원</h3>
            <p class="academy-location">
              <i class="fa-solid fa-location-dot pin-icon"></i>
              서울 서초구 방배동 234-12 · 도보 8분
            </p>
            <div class="tag-row">
              <span class="tag orange">초등부 B반</span>
              <span class="divider-line"></span>
              <span class="tag gray">창의 미술</span>
            </div>
          </div>
        </div>

        <!-- 학원 3 -->
        <div class="academy-card" onclick="location.href='art-academy.html'">
          <div class="img-wrapper">
            <img src="./PUMTO.img/img.53.png" alt="꿈꾸는 팔레트">
            <img src="./PUMTO.img/img.52.png" alt="인증 배지" class="verify-badge-img">
          </div>
          <button class="wish-btn active" onclick="event.stopPropagation();"><i class="fa-solid fa-heart"></i></button>
          <div class="card-info">
            <h3 class="academy-name">꿈꾸는 팔레트</h3>
            <p class="academy-location">
              <i class="fa-solid fa-location-dot pin-icon"></i>
              서울 서초구 서초동 98-76 · 도보 12분
            </p>
            <div class="tag-row">
              <span class="tag orange">유치부 C반</span>
              <span class="divider-line"></span>
              <span class="tag gray">드로잉·회화</span>
            </div>
          </div>
        </div>

        <!-- 더 탐색하기 -->
        <div class="explore-more" onclick="location.href='home.html'">
          <div class="explore-top-row">
            <span class="plus-icon">+</span>
            <span class="explore-title">더 탐색하기하고 저장하기</span>
          </div>
          <p class="explore-desc">마음에 드는 학원을 더 찾아보세요!</p>
        </div>
      </section>

      <!-- 인증 안내 섹션 -->
      <section class="certified-section">
        <div class="certified-box">
          <div class="cert-icon">
            <img src="./PUMTO.img/img.52.png" alt="인증 아이콘">
          </div>
          <div class="cert-text">
            <p class="cert-title"><span class="green">인증</span>된 학원이에요</p>
            <p class="cert-desc">실제 수업 후기와 정보를 확인했어요.</p>
          </div>
          <div class="cert-arrow">></div>
        </div>
      </section>

      <div class="spacer-bottom"></div>
    </main>

    <!-- 하단 탭바 -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>홈</span>
      </a>
      <a href="save.html" class="nav-item active">
        <i class="fa-solid fa-heart"></i>
        <span>찜</span>
      </a>
      <div class="nav-item-center" onclick="location.href='creative-process.html'">
        <div class="fab-btn">
          <i class="fa-solid fa-pen"></i>
          <span class="fab-text">후기작성</span>
        </div>
      </div>
      <a href="growth.html" class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        <span>성장</span>
      </a>
      <a href="mypage.html" class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>마이</span>
      </a>
    </nav>
    <script>
      (function() {
        // 하단 탭바 찜 링크 처리
        const isSaved = localStorage.getItem('pumto_isSaved') === 'true';
        document.querySelectorAll('a').forEach(link => {
          if (link.href.includes('save-academy.html') || link.href.includes('save.html')) {
            const currentPath = window.location.pathname;
            if (!currentPath.includes('save.html') && !currentPath.includes('save-academy.html')) {
              link.href = isSaved ? 'save.html' : 'save-academy.html';
            }
          }
        });

        // 찜 버튼 누르면 해당 카드 목록에서 제거하고 찜 상태 업데이트
        document.querySelectorAll('.wish-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation(); // 카드 클릭 이동 이벤트 방지
            
            const card = this.closest('.academy-card');
            if (!card) return;
            
            // 삭제 애니메이션
            card.style.transition = 'all 0.3s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
              card.remove();
              
              // 현재 남은 카드 수 확인
              const remainingCards = document.querySelectorAll('.academy-list .academy-card');
              const countEl = document.querySelector('.save-count span:last-child');
              if (countEl) {
                countEl.innerText = remainingCards.length + '개 저장됨';
              }
              
              if (remainingCards.length === 0) {
                localStorage.setItem('pumto_isSaved', 'false');
                location.href = 'save-academy.html';
              }
            }, 300);
          });
        });
      })();
    </script>
  </div>
</body>
</html>
