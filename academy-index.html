    <script>
      // Function to update save links based on state
      function updateSaveLinks() {
        const isSaved = localStorage.getItem('pumto_isSaved') === 'true';
        document.querySelectorAll('a').forEach(link => {
          if (link.href.includes('save-academy.html') || link.href.includes('save.html')) {
            const currentPath = window.location.pathname;
            if (!currentPath.includes('save.html') && !currentPath.includes('save-academy.html')) {
              link.href = isSaved ? 'save.html' : 'save-academy.html';
            }
          }
        });
      }

      // Restore state on load
      const savedState = localStorage.getItem('pumto_isSaved') === 'true';
      const item1Btn = document.querySelector('.wish-btn-card-interactive');
      if (item1Btn) {
        const icon = item1Btn.querySelector('i');
        if (savedState) {
          icon.classList.replace('fa-regular', 'fa-solid');
          item1Btn.classList.add('wish-active');
        } else {
          icon.classList.replace('fa-solid', 'fa-regular');
          item1Btn.classList.remove('wish-active');
        }
      }

      // Initialize links on load
      updateSaveLinks();

      // Item 1: Interactive toggle
      document.querySelectorAll('.wish-btn-card-interactive').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          
          const icon = btn.querySelector('i');
          if (icon.classList.contains('fa-regular')) {
            icon.classList.replace('fa-regular', 'fa-solid');
            btn.classList.add('wish-active');
          } else {
            icon.classList.replace('fa-solid', 'fa-regular');
            btn.classList.remove('wish-active');
          }
          
          // Only Item 1 affects the navigation state switch for this demo
          const isItem1Saved = icon.classList.contains('fa-solid');
          localStorage.setItem('pumto_isSaved', isItem1Saved ? 'true' : 'false');
          
          updateSaveLinks();
        });
      });

      // Items 2 & 3: Fixed state, prevent navigation
      document.querySelectorAll('.wish-btn-card-fixed').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });
    </script>
