<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUMTO QR 코드</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="./qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 배경 장식 원 */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 179, 237, 0.08) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.08) 0%, transparent 70%);
      bottom: -100px;
      left: -100px;
      border-radius: 50%;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 48px 52px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 1;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.7s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-area {
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      border-radius: 50px;
      padding: 10px 22px;
      margin-bottom: 16px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .logo-text {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .title {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .qr-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }

    .qr-container {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
      box-shadow:
        0 8px 32px rgba(79, 142, 247, 0.25),
        0 2px 8px rgba(0, 0, 0, 0.2);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .qr-container:hover {
      transform: scale(1.03);
      box-shadow:
        0 12px 40px rgba(79, 142, 247, 0.4),
        0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .qr-container canvas {
      display: block;
      border-radius: 8px;
    }

    /* QR 코너 장식 */
    .qr-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #4f8ef7;
      border-style: solid;
    }

    .qr-corner.tl { top: -4px; left: -4px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .qr-corner.tr { top: -4px; right: -4px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .qr-corner.bl { bottom: -4px; left: -4px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .qr-corner.br { bottom: -4px; right: -4px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    .scan-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .scan-icon {
      font-size: 16px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
    }

    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(79, 142, 247, 0.12);
      border: 1px solid rgba(79, 142, 247, 0.25);
      border-radius: 50px;
      padding: 10px 20px;
      color: #93c5fd;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    .url-chip:hover {
      background: rgba(79, 142, 247, 0.22);
      border-color: rgba(79, 142, 247, 0.5);
      color: #bfdbfe;
      transform: translateY(-1px);
    }

    .url-icon {
      font-size: 14px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f8ef7, #8b5cf6);
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.25s ease;
      font-family: 'Pretendard', sans-serif;
      box-shadow: 0 4px 16px rgba(79, 142, 247, 0.35);
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(79, 142, 247, 0.5);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.25);
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-area">
      <div class="logo-badge">
        <div class="logo-dot"></div>
        <span class="logo-text">PUMTO</span>
      </div>
      <h1 class="title">앱으로 바로 접속 🎨</h1>
      <p class="subtitle">카메라로 QR 코드를 스캔하면<br />품토 앱에 바로 접속할 수 있어요</p>
    </div>

    <div class="qr-wrapper">
      <div class="qr-container" id="qrBox">
        <div class="qr-corner tl"></div>
        <div class="qr-corner tr"></div>
        <div class="qr-corner bl"></div>
        <div class="qr-corner br"></div>
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>

    <div class="scan-hint">
      <span class="scan-icon">📷</span>
      카메라 앱으로 스캔하세요
    </div>

    <hr class="divider" />

    <a href="https://pumto-web-app.vercel.app" class="url-chip" target="_blank">
      <span class="url-icon">🔗</span>
      pumto-web-app.vercel.app
    </a>

    <br />
    <button class="download-btn" onclick="downloadQR()">
      ⬇️ QR 코드 저장
    </button>

    <p class="footer-note">© 2025 PUMTO · 예술 클래스 플랫폼</p>
  </div>

  <script>
    const url = 'https://pumto-web-app.vercel.app';

    // qrcodejs 라이브러리 사용 (div 기반)
    const qrDiv = document.getElementById('qrBox');
    // canvas 제거하고 div로 QR 생성
    const canvasEl = document.getElementById('qrCanvas');
    canvasEl.remove();

    const qr = new QRCode(qrDiv, {
      text: url,
      width: 220,
      height: 220,
      colorDark: '#1a1a2e',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    function downloadQR() {
      const canvas = qrDiv.querySelector('canvas');
      if (!canvas) { alert('QR 코드를 찾을 수 없어요.'); return; }
      const link = document.createElement('a');
      link.download = 'pumto-qrcode.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>

</body>
</html>
