<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- Android/Chrome PWA 설정 -->

    <!-- 移댁뭅?ㅽ넚/SNS 怨듭쑀 ?몃꽕???ㅼ젙 -->
    <meta property="og:type" content="website">

    <meta property="og:url" content="https://pumto-web-app.vercel.app">
    <script src="pwa-loader.js?v=static-dot-5" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <button class="growth-back-btn" type="button" aria-label="뒤로가기" onclick="goBackFromGrowth()">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <h1 class="title">성장 기록</h1>
      </div>
      <button class="settings-btn"><i class="fa-solid fa-gear"></i></button>
    </header>

    <script>
      function goBackFromGrowth() {
        if (document.referrer && new URL(document.referrer).origin === location.origin) {
          history.back();
        } else {
          location.href = 'home.html?v=smooth-popular-scroll-2';
        }
      }
    </script>

    <!-- Profile Card -->
    <section class="profile-card">
      <div class="profile-img-wrapper">
        <img src="./PUMTO.img/img.82.png" alt="김지우 프로필" class="profile-img">
      </div>
      <div class="profile-info">
        <h2 class="user-name">김지우</h2>
        <p class="user-desc">유지부 7세</p>
      </div>
      <div class="status-badge private">
        <i class="fa-solid fa-lock"></i> 비공개
      </div>
    </section>

    <!-- Date Selector -->
    <section class="date-selector">
      <button class="arrow-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="current-date">2026년 3월</span>
      <button class="arrow-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </section>

    <!-- Stats Section -->
    <section class="stats-section">
      <div class="stat-box">
        <p class="stat-label">완성작</p>
        <p class="stat-value">12</p>
      </div>
      <div class="stat-box">
        <p class="stat-label">출석일</p>
        <p class="stat-value">20</p>
      </div>
      <div class="stat-box">
        <p class="stat-label">성장 지수</p>
        <p class="stat-value">98</p>
      </div>
    </section>

    <!-- Notice Banner -->
    <section class="notice-banner">
      <div class="notice-icon">
        <i class="fa-solid fa-bell"></i>
      </div>
      <div class="notice-content">
        <p class="notice-text">이번 주 미술 준비물을 확인하세요!</p>
        <div class="notice-tags">
          <span class="tag">스케치북</span>
          <span class="tag">수채화 물감</span>
          <span class="tag">파레트</span>
        </div>
      </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
      <div class="gallery-header">
        <h3 class="gallery-title">이달의 갤러리</h3>
        <button class="view-all">전체보기</button>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item">
          <img src="./PUMTO.img/img.81.png" alt="작품 1">
        </div>
        <div class="gallery-item">
          <img src="./PUMTO.img/img.80.png" alt="작품 2">
        </div>
        <a href="project-details.html" class="gallery-item">
          <img src="./PUMTO.img/img.79.png" alt="작품 3">
        </a>
        <div class="gallery-item">
          <img src="./PUMTO.img/img.77.png" alt="작품 4">
        </div>
        <div class="gallery-item">
          <img src="./PUMTO.img/img.78.png" alt="작품 5">
        </div>
        <div class="gallery-item add-item">
          <div class="add-btn">
            <i class="fa-solid fa-circle-plus"></i>
            <span>추가</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>홈</span>
      </a>
      <a href="save-academy.html" class="nav-item">
        <i class="fa-solid fa-heart"></i>
        <span>찜</span>
      </a>
      <div class="nav-item-center" onclick="location.href='creative-process.html'">
        <div class="fab-btn">
          <i class="fa-solid fa-pen"></i>
          <span class="fab-text">후기작성</span>
        </div>
      </div>
      <a href="growth.html" class="nav-item active">
        <i class="fa-solid fa-chart-line"></i>
        <span>성장</span>
      </a>
      <a href="mypage.html" class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>마이</span>
      </a>
    </nav>
    <script>
      (function() {
        const isSaved = localStorage.getItem('pumto_isSaved') === 'true';
        document.querySelectorAll('a').forEach(link => {
          if (link.href.includes('save-academy.html') || link.href.includes('save.html')) {
            const currentPath = window.location.pathname;
            if (!currentPath.includes('save.html') && !currentPath.includes('save-academy.html')) {
              link.href = isSaved ? 'save.html' : 'save-academy.html';
            }
          }
        });
      })();
    </script>
  </div>
</body>
</html>
