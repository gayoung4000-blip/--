<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUMTO - 온보딩</title>
    <link rel="stylesheet" href="intro-orange.css?v=2">
</head>
<body>
    <div class="mobile-container">

        <!-- 흰색 언덕 배경 -->
        <div class="white-bg-hill"></div>

        <!-- 타이틀 (상단 오렌지 영역) -->
        <div class="title-section">
            <h2 class="main-title">
                우리 아이 주변의<br>
                미술 학원을 찾아보세요.
            </h2>
        </div>

        <!-- 일러스트 영역 (캐릭터 + 지도 말풍선) -->
        <div class="illustration-section">
            <img src="./FUMTO.img/img.89.png" alt="폰 보는 캐릭터" class="char-illust">
            <img src="./FUMTO.img/img.90.png" alt="지도 말풍선" class="map-illust">
        </div>

        <!-- 하단 콘텐츠 (흰색 영역) -->
        <div class="bottom-content">
            <div class="indicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot active"></span>
            </div>
            <button class="btn-later" onclick="location.href='login.html'">나중에 설정</button>
            <button class="btn-allow" onclick="location.href='login.html'">위치 권한 허용</button>
        </div>

    </div>
</body>
</html>
