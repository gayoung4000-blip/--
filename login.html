<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUMTO - 로그인</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="login.css?v=35">
</head>
<body>
    <div class="mobile-container">
        <!-- 상단 그린 섹션 -->
        <div class="top-section">
            <img src="./FUMTO.img/img.20.png" alt="PUMTO" class="logo-img">
            <img src="./FUMTO.img/img.87.png" alt="품토 캐릭터" class="character-img">
        </div>

        <!-- 하단 곡선 (언덕) -->
        <div class="white-bg-hill"></div>

        <!-- 하단 화이트 섹션 -->
        <div class="bottom-content">
            <!-- 로그인 버튼 -->
            <button class="btn-login" onclick="location.href='home.html'">로그인</button>

            <!-- 소셜 로그인 구분선 -->
            <div class="social-login-divider">
                <div class="line"></div>
                <span class="divider-text">소셜 로그인</span>
                <div class="line"></div>
            </div>

            <!-- 소셜 아이콘 그룹 -->
            <div class="social-icons-group">
                <div class="social-icon-btn">
                    <img src="./FUMTO.img/kakao.png" alt="카카오">
                </div>
                <div class="social-icon-btn">
                    <img src="./FUMTO.img/naver.png" alt="네이버">
                </div>
                <div class="social-icon-btn facebook-btn">
                    <img src="./FUMTO.img/facebook.png" alt="페이스북">
                </div>
                <div class="social-icon-btn">
                    <img src="./FUMTO.img/apple.png" alt="애플">
                </div>
            </div>

            <!-- 회원가입 안내 -->
            <p class="footer-signup">
                아직 PUMTO 회원이 아니신가요? 
                <span onclick="location.href='intro-blue.html'">회원가입</span>
            </p>
        </div>
    </div>
</body>
</html>
